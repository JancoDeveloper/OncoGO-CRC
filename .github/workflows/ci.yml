name: ci

on:
  push:
  pull_request:

jobs:
  prueba:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests scripts
      - name: pytest
        run: pytest -q --cov=oncogo_crc --cov-report=term-missing
      - name: e2e sintética
        run: ONCOGO_E2E=1 pytest -q -m e2e --override-ini="addopts=" tests/test_e2e_v3_7_sintetico.py
