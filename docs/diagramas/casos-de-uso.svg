<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" role="img" aria-labelledby="t">
  <title id="t">Casos de uso del flujo OncoGO-CRC</title>
  <rect width="880" height="280" fill="#f7f4ef"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="18" fill="#1c1917">Casos de uso</text>
  <g font-family="Georgia, serif" font-size="14" fill="#1c1917">
    <rect x="24" y="56" width="200" height="180" rx="8" fill="#fff" stroke="#1f4d3a"/>
    <text x="40" y="84">Investigador</text>
    <text x="40" y="112">Registra el preregistro</text>
    <text x="40" y="136">Prueba los módulos</text>
    <text x="40" y="160">Ejecuta el flujo</text>
    <rect x="280" y="56" width="250" height="180" rx="8" fill="#fff" stroke="#1f4d3a"/>
    <text x="296" y="84">Reproductor</text>
    <text x="296" y="112">Parte de v3.7-final</text>
    <text x="296" y="136">Descarga las cohortes</text>
    <text x="296" y="160">Compara con la referencia</text>
    <rect x="586" y="56" width="270" height="180" rx="8" fill="#fff" stroke="#1f4d3a"/>
    <text x="602" y="84">Evaluador</text>
    <text x="602" y="112">Lee el certificado</text>
    <text x="602" y="136">Revisa sellos y manifiesto</text>
    <text x="602" y="160">No necesita ejecutar</text>
  </g>
</svg>
