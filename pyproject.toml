[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncogo-crc"
version = "0.1.0"
description = "Pipeline protein-centric GO + ML explicable para proteómica de cáncer colorrectal (tesis OncoGO-CRC)."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "OncoGO-CRC" }]
keywords = ["proteomics", "colorectal-cancer", "gene-ontology", "bioinformatics", "explainable-ai"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "networkx>=3.1",
  "statsmodels>=0.14",
  "tqdm>=4.66",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
go-remote = ["gseapy>=1.0"]
explain = ["shap>=0.44"]
ingest = ["cptac>=1.5.0"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5"]
dev = ["pytest>=7.4", "ruff>=0.3"]

[project.scripts]
oncogo-crc = "oncogo_crc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
