[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncogo-crc"
version = "4.0.0"
description = "Flujo de trabajo bioinformático reproducible para proteómica de tejido y suero. Caso de estudio: cáncer colorrectal (corrida v3.7)."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{ name = "Juan Diego Polanco Franco" }]
keywords = ["proteomics", "colorectal-cancer", "reproducibility", "bioinformatics"]
dependencies = [
  "numpy==2.4.4",
  "pandas==3.0.2",
  "scipy==1.17.1",
  "scikit-learn==1.8.0",
  "statsmodels==0.14.6",
  "PyYAML==6.0.3",
  "directlfq==0.3.3",
  "gseapy==1.2.1",
  "shap==0.51.0",
  "openpyxl==3.1.5",
  "et-xmlfile==2.0.0",
]

[project.optional-dependencies]
# ESM-2 no entra en el modelo principal. El TSV de embeddings es una entrada congelada.
ml = ["torch", "transformers"]
dev = [
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "ruff==0.15.12",
]

[project.scripts]
oncogo-crc = "oncogo_crc.cli:main"

[tool.pytest.ini_options]
markers = [
  "datos_reales: se salta si el fichero público no está en el disco",
  "e2e: corrida sintética de la etapa v3_7; activar con ONCOGO_E2E=1",
]
addopts = "-m 'not e2e'"
testpaths = ["tests"]

[tool.coverage.run]
source = ["oncogo_crc"]
branch = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Reglas que el código de la corrida ya cumple. No se amplían en esta limpieza.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
