<svg viewBox="0 0 776 180" role="img" class="lienzo-svg"><title>Mapa de la investigación</title><desc>La pregunta usa el suero de Rai y el tejido de Vasaikar y de Tanaka. El resultado de la celda no se presenta como una prueba para un paciente.</desc><a href="/" data-id="pregunta"><rect x="24" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="40" y="108" fill="currentColor" font-size="16">Pregunta</text><a href="/metodos/proteomica" data-id="datos"><rect x="212" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="228" y="108" fill="currentColor" font-size="16">Datos</text><a href="/metodos/proteomica" data-id="metodos"><rect x="400" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="416" y="108" fill="currentColor" font-size="16">Métodos</text><a href="/" data-id="resultados"><rect x="588" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="604" y="108" fill="currentColor" font-size="16">Resultados</text><line data-origen="pregunta" data-destino="datos" x1="184" y1="102" x2="212" y2="102" stroke="currentColor" stroke-width="2"/><line data-origen="datos" data-destino="metodos" x1="372" y1="102" x2="400" y2="102" stroke="currentColor" stroke-width="2"/><line data-origen="metodos" data-destino="resultados" x1="560" y1="102" x2="588" y2="102" stroke="currentColor" stroke-width="2"/></svg>