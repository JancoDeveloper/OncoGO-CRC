<svg viewBox="0 0 776 180" role="img" class="lienzo-svg"><title>Mapa de la investigación</title><desc>La pregunta usa el suero de Rai y el tejido de Vasaikar y de Tanaka. El resultado de la celda no se presenta como una prueba para un paciente.</desc><g data-id="pregunta"><title>Pregunta</title><rect x="24" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="40" y="108" fill="currentColor" font-size="16">Pregunta</text><g data-id="datos"><title>Datos</title><rect x="212" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="228" y="108" fill="currentColor" font-size="16">Datos</text><g data-id="metodos"><title>Métodos</title><rect x="400" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="416" y="108" fill="currentColor" font-size="16">Métodos</text><g data-id="resultados"><title>Resultados</title><rect x="588" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="604" y="108" fill="currentColor" font-size="16">Resultados</text><line data-origen="pregunta" data-destino="datos" x1="184" y1="102" x2="212" y2="102" stroke="currentColor" stroke-width="2"/><line data-origen="datos" data-destino="metodos" x1="372" y1="102" x2="400" y2="102" stroke="currentColor" stroke-width="2"/><line data-origen="metodos" data-destino="resultados" x1="560" y1="102" x2="588" y2="102" stroke="currentColor" stroke-width="2"/></svg>