<svg viewBox="0 0 1152 180" role="img" class="lienzo-svg"><title>Tres clases, no un solo umbral</title><desc>TREAT y TOST separan diferente, equivalente e indeterminada. El margen está en el preregistro.</desc><a href="/metodos/expresion-diferencial" data-id="contraste"><rect x="24" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="40" y="108" fill="currentColor" font-size="16">Contraste</text><a href="/metodos/expresion-diferencial" data-id="treat"><rect x="212" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="228" y="108" fill="currentColor" font-size="16">TREAT</text><a href="/metodos/expresion-diferencial" data-id="tost"><rect x="400" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="416" y="108" fill="currentColor" font-size="16">TOST</text><a href="/metodos/expresion-diferencial" data-id="diferente"><rect x="588" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="604" y="108" fill="currentColor" font-size="16">Diferente</text><a href="/metodos/expresion-diferencial" data-id="equivalente"><rect x="776" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="792" y="108" fill="currentColor" font-size="16">Equivalente</text><a href="/metodos/expresion-diferencial" data-id="indeterminada"><rect x="964" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="980" y="108" fill="currentColor" font-size="16">Indeterminada</text><line data-origen="contraste" data-destino="treat" x1="184" y1="102" x2="212" y2="102" stroke="currentColor" stroke-width="2"/><line data-origen="contraste" data-destino="tost" x1="184" y1="36" x2="400" y2="36" stroke="currentColor" stroke-width="2"/><line data-origen="treat" data-destino="diferente" x1="372" y1="36" x2="588" y2="36" stroke="currentColor" stroke-width="2"/><line data-origen="tost" data-destino="equivalente" x1="560" y1="36" x2="776" y2="36" stroke="currentColor" stroke-width="2"/><line data-origen="tost" data-destino="indeterminada" x1="560" y1="36" x2="964" y2="36" stroke="currentColor" stroke-width="2"/></svg>