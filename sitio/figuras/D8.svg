<svg viewBox="0 0 1152 180" role="img" class="lienzo-svg"><title>Tres clases, no un solo umbral</title><desc>TREAT y TOST separan diferente, equivalente e indeterminada. El margen está en el preregistro.</desc><g data-id="contraste"><title>Contraste</title><rect x="24" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="40" y="108" fill="currentColor" font-size="16">Contraste</text><g data-id="treat"><title>TREAT</title><rect x="212" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="228" y="108" fill="currentColor" font-size="16">TREAT</text><g data-id="tost"><title>TOST</title><rect x="400" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="416" y="108" fill="currentColor" font-size="16">TOST</text><g data-id="diferente"><title>Diferente</title><rect x="588" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="604" y="108" fill="currentColor" font-size="16">Diferente</text><g data-id="equivalente"><title>Equivalente</title><rect x="776" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="792" y="108" fill="currentColor" font-size="16">Equivalente</text><g data-id="indeterminada"><title>Indeterminada</title><rect x="964" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="980" y="108" fill="currentColor" font-size="16">Indeterminada</text><line data-origen="contraste" data-destino="treat" x1="184" y1="102" x2="212" y2="102" stroke="currentColor" stroke-width="2"/><line data-origen="contraste" data-destino="tost" x1="184" y1="36" x2="400" y2="36" stroke="currentColor" stroke-width="2"/><line data-origen="treat" data-destino="diferente" x1="372" y1="36" x2="588" y2="36" stroke="currentColor" stroke-width="2"/><line data-origen="tost" data-destino="equivalente" x1="560" y1="36" x2="776" y2="36" stroke="currentColor" stroke-width="2"/><line data-origen="tost" data-destino="indeterminada" x1="560" y1="36" x2="964" y2="36" stroke="currentColor" stroke-width="2"/></svg>