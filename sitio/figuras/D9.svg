<svg viewBox="0 0 776 180" role="img" class="lienzo-svg"><title>Del preregistro al certificado</title><desc>La corrida publicada es la E. El documento de determinismo dice que D y E coinciden en los números.</desc><a href="/investigacion/reproducibilidad" data-id="preregistro"><rect x="24" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="40" y="108" fill="currentColor" font-size="16">Preregistro</text><a href="/investigacion/reproducibilidad" data-id="corrida"><rect x="212" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="228" y="108" fill="currentColor" font-size="16">Corrida</text><a href="/investigacion/reproducibilidad" data-id="sello"><rect x="400" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="416" y="108" fill="currentColor" font-size="16">Sello</text><a href="/investigacion/reproducibilidad" data-id="par"><rect x="588" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="604" y="108" fill="currentColor" font-size="16">D y E</text><line data-origen="preregistro" data-destino="corrida" x1="184" y1="102" x2="212" y2="102" stroke="currentColor" stroke-width="2"/><line data-origen="corrida" data-destino="sello" x1="372" y1="102" x2="400" y2="102" stroke="currentColor" stroke-width="2"/><line data-origen="sello" data-destino="par" x1="560" y1="102" x2="588" y2="102" stroke="currentColor" stroke-width="2"/></svg>