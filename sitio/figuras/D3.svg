<svg viewBox="0 0 1152 180" role="img" class="lienzo-svg"><title>Linaje de los ficheros de entrada</title><desc>Cada nodo es un fichero del manifiesto de la corrida o el resumen del suero. Al pulsar un nodo se marca el tramo que sale o llega a él.</desc><g data-id="cptac"><title>CPTAC</title><rect x="24" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="40" y="108" fill="currentColor" font-size="16">CPTAC</text><g data-id="tanaka"><title>Tanaka</title><rect x="212" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="228" y="108" fill="currentColor" font-size="16">Tanaka</text><g data-id="rai"><title>Suero</title><rect x="400" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="416" y="108" fill="currentColor" font-size="16">Suero</text><g data-id="hpa"><title>HPA</title><rect x="588" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="604" y="108" fill="currentColor" font-size="16">HPA</text><g data-id="go"><title>GO</title><rect x="776" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="792" y="108" fill="currentColor" font-size="16">GO</text><g data-id="celda"><title>Celda</title><rect x="964" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="980" y="108" fill="currentColor" font-size="16">Celda</text><line data-origen="cptac" data-destino="celda" x1="184" y1="36" x2="964" y2="36" stroke="currentColor" stroke-width="2"/><line data-origen="tanaka" data-destino="celda" x1="372" y1="36" x2="964" y2="36" stroke="currentColor" stroke-width="2"/><line data-origen="rai" data-destino="celda" x1="560" y1="36" x2="964" y2="36" stroke="currentColor" stroke-width="2"/><line data-origen="hpa" data-destino="celda" x1="748" y1="36" x2="964" y2="36" stroke="currentColor" stroke-width="2"/><line data-origen="go" data-destino="celda" x1="936" y1="102" x2="964" y2="102" stroke="currentColor" stroke-width="2"/></svg>