<svg viewBox="0 0 1152 180" role="img" class="lienzo-svg"><title>Linaje de los ficheros de entrada</title><desc>Cada nodo es un fichero del manifiesto de la corrida o el resumen del suero. Al pulsar un nodo se marca el tramo que sale o llega a él.</desc><a href="/datos/pdc000116" data-id="cptac"><rect x="24" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="40" y="108" fill="currentColor" font-size="16">CPTAC</text><a href="/datos/pxd034575" data-id="tanaka"><rect x="212" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="228" y="108" fill="currentColor" font-size="16">Tanaka</text><a href="/datos/pxd055218" data-id="rai"><rect x="400" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="416" y="108" fill="currentColor" font-size="16">Suero</text><a href="/datos/hpa" data-id="hpa"><rect x="588" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="604" y="108" fill="currentColor" font-size="16">HPA</text><a href="/datos/gene-ontology" data-id="go"><rect x="776" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="792" y="108" fill="currentColor" font-size="16">GO</text><a href="/metodos/expresion-diferencial" data-id="celda"><rect x="964" y="70" width="160" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/></a><text x="980" y="108" fill="currentColor" font-size="16">Celda</text><line data-origen="cptac" data-destino="celda" x1="184" y1="36" x2="964" y2="36" stroke="currentColor" stroke-width="2"/><line data-origen="tanaka" data-destino="celda" x1="372" y1="36" x2="964" y2="36" stroke="currentColor" stroke-width="2"/><line data-origen="rai" data-destino="celda" x1="560" y1="36" x2="964" y2="36" stroke="currentColor" stroke-width="2"/><line data-origen="hpa" data-destino="celda" x1="748" y1="36" x2