- nombre: no incorporado
  biorender: No se usó. La publicación web de figuras de BioRender exige una licencia que este proyecto no tiene, y la exportación gratuita lleva marca de agua.
  lottiefiles: No se usó. Cada animación tiene su propia licencia y el reproductor sería un script de tercero. La barra de la celda se dibuja con los conteos, sin animación decorativa.
  nci: No se incorporó un archivo del National Cancer Institute. No había una ficha de derechos comprobada para una lámina que pudiera sustituir a la anatomía ya atribuida.
