# Comparaciones estadísticas (grupo A vs grupo B) enlazadas a columnas de metadata.
# condition_column: nombre de columna en el TSV de muestras.
# group_a / group_b: valores discretos de esa columna.

comparisons:
  cptac_tumor_vs_normal:
    dataset: cptac_colorectal
    label: "Tumor vs tejido adyacente normal (CPTAC)"
    condition_column: condition
    group_a: tumor
    group_b: normal
    # Si existe ``participant_id`` (o la columna en ``differential.paired_column``) con pares 1 tumor + 1 normal, se usa t-test pareado.
    paired_by: participant_id

  plasma_crc_vs_healthy:
    dataset: plasma_crc_2024
    label: "Plasma CRC vs control sano"
    condition_column: condition
    group_a: crc
    group_b: healthy

  pride_validation_tumor_vs_normal:
    dataset: pride_crc_meta
    label: "PRIDE validación externa: tumor vs normal"
    condition_column: condition
    group_a: tumor
    group_b: normal

  cptac_stage_advanced_vs_early:
    dataset: cptac_colorectal
    label: "Estadio avanzado vs temprano (si stage está disponible)"
    condition_column: stage_bin
    group_a: advanced
    group_b: early
    optional: true

  cptac_msi_vs_mss:
    dataset: cptac_colorectal
    label: "MSI vs MSS"
    condition_column: msi_status
    group_a: MSI
    group_b: MSS
    optional: true

  cptac_primary_vs_metastatic:
    dataset: cptac_colorectal
    label: "CPTAC primario vs metastásico (si metadata disponible)"
    condition_column: metastatic_status
    group_a: metastatic
    group_b: primary
    optional: true

  cptac_eocrc_vs_lorc:
    dataset: cptac_colorectal
    label: "EOCRC vs LOCRC (age_bin young vs older; contexto epidemiológico CO)"
    condition_column: age_bin
    group_a: young
    group_b: older
    optional: true

  cptac_cms4_vs_rest:
    dataset: cptac_colorectal
    label: "CMS4 vs otros CMS (requiere cms_subtype_supplement_tsv + columna cms_subtype_bin)"
    condition_column: cms_subtype_bin
    group_a: CMS4
    group_b: nonCMS4
    optional: true

  cptac_hispanic_latino_vs_non:
    dataset: cptac_colorectal
    label: "Hispano/latino vs no hispano/latino (etnicidad NIH; contexto US — ver clinical_demographics.md)"
    condition_column: hispanic_latino_bin
    group_a: hispanic_latino
    group_b: non_hispanic_latino
    optional: true

  plasma_responder_vs_nonresponder:
    dataset: plasma_crc_2024
    label: "Plasma respondedor vs no respondedor (si metadata disponible)"
    condition_column: treatment_response
    group_a: responder
    group_b: nonresponder
    optional: true
