# Registro de los subíndices del certificado R. Única fuente de verdad.
#
# El JSON, el TSV, las figuras y el PDF se generan desde aquí. Antes, el código
# actualizaba el valor y el estado de un subíndice pero dejaba la definición
# vieja, y así R4 figuraba como `calculado` y a la vez decía «La pureza tumoral
# aún no es covariable del diferencial». Eso es lo que este fichero impide.
#
# Reglas que un test comprueba (tests/test_registro_subindices.py):
#   - si `estado_si_calculado` existe, su definición no contiene «aún no»,
#     «todavía no» ni «no ejecutad»;
#   - cada subíndice declara el nombre de su numerador y de su denominador;
#   - la unidad del denominador es siempre proteínas únicas, nunca filas.

version: 2

subindices:
  - codigo: R1_direccion
    nombre: "Concordancia de dirección entre cohortes"
    unidad: fraccion
    numerador: n_mismo_signo
    denominador: n_sign_evaluable
    unidad_denominador: proteinas_unicas
    definicion: >-
      Fracción de proteínas certificadas en CPTAC cuyo log2FC tiene el mismo
      signo en la réplica, entre las que la réplica alcanza a medir con log2FC
      finito y distinto de cero. El intervalo es el exacto de Clopper–Pearson y
      el contraste es contra 0,5.
    nota_obligatoria: >-
      El denominador no son los hallazgos, son los hallazgos medibles en la
      réplica. La cobertura (n_sign_evaluable / n_certificadas) se reporta junto
      al valor. Si es menor que 0,50, este número es una concordancia
      condicionada a detectabilidad.
    clausula: h1_proteina
    metodo: clopper_pearson

  - codigo: R2_detectabilidad
    nombre: "Detectabilidad de los hallazgos en la réplica"
    unidad: fraccion
    numerador: peptide_n_measurable
    denominador: peptide_n_discovery_significant
    unidad_denominador: proteinas_unicas
    definicion: >-
      Fracción de proteínas certificadas en CPTAC cuyo UniProt tiene al menos un
      péptido único en el proteinGroups de la réplica.
    nota_obligatoria: >-
      No demuestra que la misma secuencia peptídica se haya observado en las dos
      plataformas. Es una ventana de medibilidad, no una identificación
      compartida.
    metodo: conteo_peptidos_unicos

  - codigo: R3_homogeneidad
    nombre: "Homogeneidad entre estudios (1 − I²)"
    unidad: mediana
    numerador: null
    denominador: n_proteinas_meta_evaluables
    unidad_denominador: proteinas_unicas
    definicion: >-
      Mediana de (1 − I²) entre las proteínas certificadas con efecto y error
      estándar en al menos tres cohortes de tejido, por meta-análisis de efectos
      aleatorios REML ajustado proteína por proteína. Las matrices no se fusionan:
      solo se combinan los efectos.
    nota_obligatoria: >-
      Con dos cohortes I² es muy inestable, así que el preregistro exige tres o
      más. Si no se alcanzan, el estado es no_calculable y se dice cuántas hay.
    metodo: reml

  - codigo: R4_composicion
    nombre: "Fracción del efecto que sobrevive al igualar la composición del tejido"
    unidad: fraccion
    numerador: n_certified_surviving
    denominador: n_certified
    unidad_denominador: proteinas_unicas
    definicion: >-
      Fracción de proteínas certificadas que siguen pasando treat y BH cuando el
      contraste de composición del par entra como covariable y el efecto se
      evalúa en diferencia de composición cero.
    nota_obligatoria: >-
      Es una cota del efecto de composición de tejido, no una pureza medida. El
      método principal excluye cada proteína de su propio índice. Solo cuando la
      covariable es la pureza ABSOLUTE de TCGA se puede hablar de pureza medida.
    metodo: covariable_de_par_leave_one_out

  - codigo: R5_nulo
    nombre: "p empírico frente al nulo de permutación"
    unidad: p_valor
    numerador: n_permutaciones_con_mas_hallazgos
    denominador: n_permutaciones
    unidad_denominador: permutaciones
    definicion: >-
      p empírico (b + 1) / (B + 1) del número de proteínas significativas
      observado frente al que sale al invertir al azar el signo de las
      diferencias pareadas, con la varianza del prior calculada una sola vez
      sobre los datos observados.
    nota_obligatoria: >-
      El p mínimo alcanzable es 1 / (B + 1). Si b = 0, el valor reportado es ese
      piso y se declara como tope, no como estimación. En la réplica de 16 pares
      el espacio de inversiones se enumera completo, así que el p es exacto.
    metodo: permutacion_de_signo
