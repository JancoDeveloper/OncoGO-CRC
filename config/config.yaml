# OncoGO-CRC — configuración global del pipeline
# Ver GUIA_CONFIGURACION.md en la raíz para el significado de cada bloque.

project:
  name: OncoGO-CRC
  seed: 42
  primary_dataset: cptac_colorectal

paths:
  # Directorio base opcional (ruta absoluta recomendada): data/, results/, reports/, metadata/
  # y la salida generada docs/web se leen y escriben aquí. En otro equipo deja "" o usa
  # ONCOGO_CRC_DATA_WORKSPACE. Prioridad: CLI --data-workspace > env > esta clave.
  data_workspace: "/Volumes/JANCODATA/OncoGO-CRC"
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  results_dir: results
  metadata_dir: metadata
  reports_dir: reports

# Mapas suplementarios (gene_symbol/uniprot) concatenados al maestro; el maestro gana en conflicto de protein_id.
mapping:
  supplementary_map_paths:
    - metadata/protein_id_maps/gene_uniprot_human_reviewed_bulk.tsv

harmonize_public_metadata:
  enabled: true
  cptac:
    enabled: true
    pdc_study_submitter_id: "PDC000116"
    # TSV con columnas participant_id, cms_subtype (CMS1–CMS4) para comparaciones CMS4 vs resto.
    # Por defecto apunta al predictor proteómico simplificado (scripts/predict_cms_from_proteome.py).
    # Recomendado para tesis: reemplazar con Vasaikar 2019 Cell, Supp. Table S1 (CPTAC2 prospective colon).
    cms_subtype_supplement_tsv: metadata/clinical_layers/cptac_cms_predicted.tsv
  pride:
    enabled: true
  plasma:
    enabled: true

download_real:
  enabled: true
  output_dir: data/raw
  manifests_dir: data/manifests
  audit_dir: results/validation
  timeout_s: 60
  timeout_seconds: 60
  retries: 3
  overwrite: false
  checksum_validation: false
  prefer_processed_over_raw: true
  allow_partial_success: true
  fail_on_validation_error: false
  auth:
    pdc_token_env: PDC_TOKEN
    pride_token_env: PRIDE_TOKEN
    iprox_token_env: IPROX_TOKEN

clinical_filters:
  enable_stratified_filters: true
  enforce_matching_after_filter: true
  age_bins:
    mode: custom
    bins:
      - name: young
        min: 0
        max: 49
      - name: older
        min: 50
        max: 200
  stage_mapping:
    early: ["stage i", "stage ia", "stage ib", "stage ii", "stage iia", "stage iib", "stage iic"]
    advanced: ["stage iii", "stage iiia", "stage iiib", "stage iiic", "stage iv", "stage iva", "stage ivb", "stage ivc"]
  min_samples_per_group:
    differential: 5
    go: 5
    ml: 15

validation:
  require_matrix: true
  require_metadata: true
  require_protein_id_first_column: true
  require_condition_column: true
  require_exact_sample_match: true
  warn_on_missing_clinical_vars: true
  required_core_vars: [sample_id, condition]
  recommended_clinical_vars: [sex, age, age_bin, stage, stage_bin, stage_group, msi_status, ethnicity, race, hispanic_latino_bin, country, geographic_region_bin, enrollment_site, tumor_site, cms_subtype, cms_subtype_bin, metastatic_status, treatment_response]

web_publish:
  enabled: true
  web_reports_dir: reports/web
  runs_dir: reports/runs
  latest_run_alias: latest
  site_title: OncoGO-CRC
  include_dataset_status: true
  include_clinical_coverage: true
  include_base_results: true
  include_stratified_results: true
  include_stability: true
  include_limitations: true

preprocessing:
  missing_threshold_protein: 0.30
  missing_threshold_sample: 0.25
  log2_transform: true
  imputation_method: knn
  knn_neighbors: 5
  normalize_method: zscore_protein
  batch_correction: none
  # Si true, escribe además ``*_normalized.tsv`` idéntico a ``*_zscore.tsv`` (compatibilidad con scripts antiguos).
  write_legacy_normalized_alias: true
  # PCA rápido (2 componentes) sobre muestras en ``results/qc/``; NaN→0 solo para este cálculo.
  write_qc_pca: true

differential:
  alpha: 0.05
  fdr_method: fdr_bh
  # Efecto mínimo en ``log2fc`` (matriz **log2norm**; Δ de medias en escala log2).
  min_abs_log2fc: 0
  # Ejecuta comparaciones optional:true si la columna existe y hay ≥ N muestras por grupo.
  auto_run_optional_comparisons: true
  optional_comparison_min_n_per_group: 3
  # Columna de metadata para contraste pareado (tumor/normal del mismo participante) cuando ``comparisons.*.paired_by`` no la fija.
  paired_column: participant_id

go:
  fdr_threshold: 0.05
  ontologies: [BP, MF, CC]
  semantic_reduction: true
  min_genes_per_term: 5
  max_genes_per_term: 500
  # Si casi todo el proteoma es “significativo”, ORA pierde especificidad. 0 = sin tope (usa todas).
  ora_foreground_max_genes: 800
  # Filtro extra solo para el foreground de ORA (además de FDR). 0 = desactivado.
  ora_min_abs_log2fc: 0

# GSEA pre-ranked offline (mismo go_gene_long.tsv que ORA); ranking continuo (t_stat o sign×−log10 p).
gsea:
  enabled: true
  fdr_threshold: 0.25
  min_size: 15
  max_size: 500
  permutations: 200
  # Varios rankings (publicación): el primero también se escribe como <comp>_gsea_go.tsv
  ranking_metrics: [t_stat, signed_neglog10_p]
  ontologies: [BP, MF, CC]
  seed: 42
  clear_stale_outputs_before_run: true

# Intersección firma CPTAC ∩ PRIDE (results/reproducibility/).
reproducibility:
  cptac_pride_overlap:
    enabled: true
    cptac_comparison: cptac_tumor_vs_normal
    pride_comparison: pride_validation_tumor_vs_normal
    padj_alpha: 0.05

# Bundle JSON para ProteinsLanguage / STRING / AlphaFold (results/export/).
export_bundle:
  enabled: true
  primary_comparison: cptac_tumor_vs_normal
  diff_top: 300
  # UniProt REST + caché data/interim/uniprot_lookup_cache.json; 0 = sin red.
  uniprot_top_n: 0

# KEGG vía Enrichr (gseapy); requiere red + `pip install -e ".[go-remote]"` (gseapy).
kegg_enrichment:
  enabled: true
  comparison: cptac_tumor_vs_normal
  enrichr_library: KEGG_2021_Human
  min_genes: 10

network:
  correlation_threshold: 0.6
  min_degree_for_hub: 8

ml:
  test_size: 0.25
  # lasso = SGD log-loss L1; elastic_net = SGD elasticnet; random_forest
  models: [lasso, elastic_net, random_forest]
  random_forest_n_estimators: 200
  linear_alpha: 0.02
  # SHAP (TreeExplainer sobre RF): requiere pip install -e ".[explain]"; si falta shap, la etapa sigue sin él.
  use_shap: true
  shap_background_max: 256
  # 0 = solo hold-out; 5 = ROC-AUC en StratifiedKFold sobre todo el conjunto etiquetado (media ± std en métricas).
  cv_folds: 5
  # Nested CV: pliegue externo = estimación de generalización; interno = selección de hiperparámetros (menos optimista que un solo split).
  nested_cv:
    enabled: true
    # Solo RF en nested CV (mucho más rápido que L1+EN+RF). Para los tres: only_rf: false y sin `models`.
    only_rf: true
    # Lista opcional que sobrescribe only_rf, p.ej. [random_forest] o [l1, rf] (alias: l1, elastic_net, rf).
    models: []
    outer_splits: 5
    inner_splits: 3
    # Árboles solo en nested (por defecto = random_forest_n_estimators; bajar acelera el grid).
    rf_n_estimators: 120
    linear_alpha_grid: [0.005, 0.02, 0.08]
    rf_max_depth_grid: [null, 12, 20]
    rf_min_samples_leaf_grid: [1, 2]
  external_transfer:
    enabled: true
    train_dataset: cptac_colorectal
    test_dataset: pride_crc_meta
    # Calibración (Platt o isotónica) con CV solo sobre CPTAC antes de evaluar en PRIDE.
    calibration_method: sigmoid
    calibration_cv: 3
  feature_stability_bootstrap_n: 50
  bootstrap_top_k: 30

# Matriz de evidencia in silico + tablas opcionales TCGA/supervivencia (después de `clinical`).
external_evidence:
  enabled: true
  primary_comparison: cptac_tumor_vs_normal
  merge_translation: true
  # TSV de concordancia transcriptómica (TCGA COAD+READ desde UCSC Xena).
  # Genera con: ``python scripts/fetch_tcga_coadread_log2fc.py``
  tcga_rnaseq_log2fc_tsv: metadata/tcga_auxiliary/tcga_coadread_log2fc.tsv
  # Cox HR por gen (TCGA COAD+READ OS, lifelines).
  # Genera con: ``python scripts/fetch_tcga_coadread_survival.py``
  survival_gene_cox_tsv: metadata/tcga_auxiliary/tcga_coadread_cox_os.tsv

# Capa C — priorización por evidencia convergente (results/prioritization/).
# Proveedores externos = snapshots locales pluggables en metadata/evidence/ (ver README allí).
# La evidencia ausente NO penaliza el score (diseño no-promisorio: hipótesis, no dianas validadas).
prioritization:
  enabled: true
  primary_comparison: cptac_tumor_vs_normal
  alpha: 0.05
  # significant | all | topfc (fallback a |log2fc| si no hay significativas).
  candidate_source: significant
  max_candidates: 500
  evidence_dir: metadata/evidence
  # Pesos del score de convergencia (media ponderada de señales disponibles).
  weights:
    diff_effect: 1.0
    diff_significance: 1.0
    reproducible: 1.5
    network_hub: 0.5
    depmap_essentiality: 1.5
    opentargets_tractability: 1.5
    dgidb_druggability: 1.0
    hpa_tumor_specificity: 1.0
    gtex_safety: 1.0
    cbioportal_genomic: 0.75

translation:
  # Cuatro niveles cuantitativos internos (percentiles de evidence_score); ver también capas literarias en context_layers_path.
  evidence_tiers:
    - tier_A_cuantitativo_fuerte
    - tier_B_cuantitativo_moderado
    - tier_C_hipotesis
    - tier_D_exploratorio
  # Genes CMS / biomarcadores / biopsia líquida (García-Foncillas et al. 2026, ACHO) para columnas en traslación clínica.
  context_layers_path: metadata/clinical_layers/crc_context_layers.yaml

demo:
  enabled: false
  n_proteins: 120
  n_samples_tumor: 24
  n_samples_normal: 24
  n_shifted_proteins: 25
