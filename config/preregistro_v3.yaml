      M2_proteinas_principal: "matriz principal v3.3"
      M3_solo_qc: "las cinco puntuaciones QC"
      M4_solo_coagulacion: "la puntuación de coagulación"
      M5_principal_residualizada_qc: "M2 con cada proteína residualizada por las cinco QC, ajustado dentro del pliegue"
      M6_principal_pca5: "M2 reducida a 5 componentes principales dentro del pliegue"
    validacion: "5 pliegues estratificados, 20 repeticiones; nulo de 1000 permutaciones con el mismo tubo"
    intervalo: "LeDell 2015 sobre las predicciones fuera del pliegue de la primera repetición; la dispersión entre pliegues se informa aparte y no se llama intervalo"
    titular:
      alfa: 0.05
      auc_minima: 0.70
      regla: >-
        Si M2 tiene p de permutación >= 0,05: sin_separacion_detectable.
        Si M2 tiene p < 0,05, y M5 tiene p < 0,05 y AUC fuera del pliegue >= 0,70:
        senal_mas_alla_de_la_calidad. En otro caso: separacion_explicada_por_calidad.
      textos:
        sin_separacion_detectable: "Con 20 muestras por grupo, el suero no separa el cáncer colorrectal de la colonoscopia negativa."
        senal_mas_alla_de_la_calidad: "El suero separa el cáncer de la colonoscopia negativa más allá de la calidad de muestra. Es una señal de fase 1, no un biomarcador."
        separacion_explicada_por_calidad: "La separación del suero entre cáncer y colonoscopia negativa se explica por la calidad de muestra."
    semillas: "las de enmienda_v3_2 (ml_cv 720, ml_permutacion 721)"
  tejido:
