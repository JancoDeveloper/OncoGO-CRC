# Registro lógico de datasets públicos (CPTAC, PRIDE, plasma, etc.)
# Las rutas son relativas a la raíz del repositorio.
# MVP núcleo obligatorio: cptac_colorectal + pride_crc_meta + plasma_crc_2024
# MVP extendido opcional: crcdb_context + pharmacoproteomics + metastatic_crc_optional

datasets:
  cptac_colorectal:
    label: "CPTAC Colon Adenocarcinoma (PDC/CPTAC)"
    role: primary
    mvp_tier: core_required
    matrix_path: data/raw/cptac/cptac_crc_matrix.tsv
    sample_metadata: metadata/sample_metadata/cptac_metadata.tsv
    id_column: sample_id
    protein_column: protein_id
    # Fuente primaria PDC: estudio portal PDC000116 (Prospective Colon PNNL proteome, tumor/normal emparejado).
    # Alternativa rápida (sin URLs firmadas): `oncogo-crc run --stage ingest_cptac` tras `pip install 'oncogo-crc[ingest]'`.
    download_real:
      enabled: true
      provider: pdc
      pdc_study_submitter_id: "PDC000116"
      study_submitter_id: ""
      project_submitter_id: ""
      file_selection:
        prefer_extensions: [".tsv", ".txt", ".csv", ".xlsx"]
        # tmt10/proteome/colon solo refuerzan matriz en código (pick_best_files); no duplicar aquí para no sesgar metadata.
        # No incluir "sample" aquí: refuerza archivos tipo *.sample.txt como si fueran matriz.
        include_keywords: ["protein", "abundance", "quant", "harmonized", "ratio", "prot", "clinical", "metadata", "biospecimen"]
        exclude_keywords:
          - "raw"
          - ".mzml"
          - ".raw"
          - ".wiff"
          - ".d"
          - ".mgf"
          - "readme"
          - "phospho"
          - "peptide"
          - "masic"
          - "msgf"
          - "supplementary_data_tcga"
          - "sample_proteinid"
          - ".tar.gz"
          - ".tar"
          - "mzid"
          - "pep.xml"
          - "mzml"
      matrix_url: ""
      metadata_url: ""
      headers: {}
      query_params: {}
      overwrite: false
      timeout_s: 120
      retries: 3
    requires_token: false

  pride_crc_meta:
    label: "PRIDE — tejido CRC (meta-análisis / estudios fusionados)"
    role: external_validation
    mvp_tier: core_required
    matrix_path: data/raw/pride/pride_crc_matrix.tsv
    sample_metadata: metadata/sample_metadata/pride_merged_metadata.tsv
    id_column: sample_id
    protein_column: protein_id
    download_real:
      enabled: true
      provider: pride
      source_catalog_url: "https://www.ebi.ac.uk/pride/ws/archive/v2/projects"
      accessions: ["PXD034575"]
      source_project_url: "https://www.ebi.ac.uk/pride/archive/projects/PXD034575"
      file_selection:
        prefer_extensions: [".tsv", ".txt", ".csv", ".xlsx", ".tsv.gz"]
        include_keywords: ["protein", "abundance", "intensity", "quant", "matrix", "report", "mztab", "clinical", "metadata", "sample", "perseus", "maxquant", "sdrf", "experimental"]
        exclude_keywords: ["raw", ".mzml", ".wiff", ".d", ".mgf", "readme", "description", "note", "fasta", "xml"]
        min_size_kb: 10
      matrix_url: ""
      metadata_url: ""
      headers: {}
      query_params: {}
      overwrite: false
      timeout_s: 180
      retries: 5
    requires_token: false

  plasma_crc_2024:
    label: "Plasma proteomics CRC vs control (capa clínica)"
    # PXD036594: matriz publicada es DIA a nivel péptido (columnas Protein Name / Peptide Sequence + runs).
    # PRIDE solo lista .xlsx + .zip de instrumento; no hay metadata tabular descargable vía API → curar
    # metadata/sample_metadata/plasma_metadata.tsv (sample_id, condition) desde el suplemento del artículo o iProX.
    role: clinical_layer
    mvp_tier: core_required
    matrix_path: data/raw/plasma/plasma_crc_matrix.tsv
    sample_metadata: metadata/sample_metadata/plasma_metadata.tsv
    id_column: sample_id
    protein_column: protein_id
    download_real:
      enabled: true
      provider: pride
      # PXD047207 no lista archivos en PRIDE Archive v2; PXD036594 (DIA plasma CRC) tiene matriz procesada (.xlsx).
      accessions: ["PXD036594"]
      host_repository: "iProX"
      source_catalog_url: ""
      fallback_project_uri: "https://www.iprox.org/page/project.html?id=IPX0005221000"
      file_selection:
        prefer_extensions: [".tsv", ".txt", ".csv", ".xlsx"]
        include_keywords: ["plasma", "protein", "matrix", "metadata", "clinical", "supplementary", "sample"]
        exclude_keywords: ["raw", ".mzml", ".wiff", ".d", ".mgf", "readme", "description", "note", ".zip", "prm", "skyline", "dia.zip"]
      matrix_url: ""
      metadata_url: ""
      headers: {}
      query_params: {}
      overwrite: false
      timeout_s: 120
      retries: 3
    requires_token: false

  crcdb_context:
    enabled: false
    label: "CRCDB / contexto EOCRC (opcional)"
    role: contextual
    mvp_tier: extended_optional
    matrix_path: data/raw/crcdb/crcdb_matrix.tsv
    sample_metadata: metadata/sample_metadata/crcdb_metadata.tsv
    id_column: sample_id
    protein_column: protein_id
    download_real:
      enabled: true
      provider: manual
      remote_source:
        description: "CRCDB public annotations"
        homepage: "https://crcdb.org"
        access_mode: "manual-curated"
      source_catalog_url: "https://crcdb.org"
      matrix_url: ""
      metadata_url: ""
      headers: {}
      query_params: {}
      overwrite: false
      timeout_s: 120
      retries: 3
    status_policy: context_only

  pharmacoproteomics:
    enabled: false
    label: "Farmacoproteómica / PDOs (opcional)"
    role: expansion
    mvp_tier: extended_optional
    matrix_path: data/raw/pharmacoproteomics/pharmacoproteomics_matrix.tsv
    sample_metadata: metadata/sample_metadata/pharmacoproteomics_metadata.tsv
    id_column: sample_id
    protein_column: protein_id
    download_real:
      enabled: true
      provider: pride
      source_catalog_url: "https://www.ebi.ac.uk/pride/ws/archive/v2/projects"
      accessions: ["PXD019234"]
      file_selection:
        prefer_extensions: [".tsv", ".txt", ".csv", ".xlsx"]
        include_keywords: ["drug", "treatment", "response", "protein", "abundance", "metadata", "sample"]
        exclude_keywords: ["raw", ".mzml", ".wiff", ".d", ".mgf", "readme", "description", "note"]
      matrix_url: ""
      metadata_url: ""
      headers: {}
      query_params: {}
      overwrite: false
      timeout_s: 120
      retries: 3
    requires_token: false

  metastatic_crc_optional:
    enabled: false
    label: "Metastatic CRC (iProx / CRLM / cohortes afines) — opcional"
    role: expansion_metastasis
    mvp_tier: extended_optional
    matrix_path: data/raw/metastatic/metastatic_crc_matrix.tsv
    sample_metadata: metadata/sample_metadata/metastatic_crc_metadata.tsv
    id_column: sample_id
    protein_column: protein_id
    download_real:
      enabled: true
      provider: px
      accession: "PXD021238"
      host_repository: "PRIDE"
      source_catalog_url: "https://proteomecentral.proteomexchange.org/cgi/GetDataset?ID=PXD021238&test=no"
      file_selection:
        prefer_extensions: [".tsv", ".txt", ".csv", ".xlsx"]
        include_keywords: ["metastasis", "liver", "protein", "abundance", "metadata", "sample"]
        exclude_keywords: ["raw", ".mzml", ".wiff", ".d", ".mgf", "readme", "description", "note"]
      matrix_url: ""
      metadata_url: ""
      headers: {}
      query_params: {}
      overwrite: false
      timeout_s: 120
      retries: 3
    requires_token: false

protein_id_map: metadata/protein_id_maps/protein_mapping_master.tsv
